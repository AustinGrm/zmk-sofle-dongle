# Eyelash Sofle — XIAO nRF52840 dongle central. No display, no lighting.
#
# NOTE: config/eyelash_sofle.conf is merged AFTER this file, so anything it
# sets (ZMK_DISPLAY=y, EC11=y, ZMK_SLEEP=y) must be overridden with
# -DCONFIG_... cmake-args in build.yaml, not here.

# Split: dongle is central, both halves are peripherals.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# 2 peripherals + host profiles
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# Show each half's battery on the host instead of the dongle's own (there is none).
CONFIG_BT_BAS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# No on-board hardware on the dongle.
CONFIG_ZMK_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n
CONFIG_WS2812_STRIP=n

# Mouse / pointing must live on the central.
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n
